services:
  - type: web
    name: misinformation-detector
    env: python
    plan: free
    buildCommand: "python3.11 -m pip install --upgrade pip && python3.11 -m pip install -r requirements_rf_only.txt || echo 'Training skipped'"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers=2 --threads=4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: USE_ONLY_RF
        value: 'true'
      - key: FLASK_DEBUG
        value: 'false'
      - key: SECRET_KEY
        sync: false
    autoDeploy: true
    healthCheckPath: /health
